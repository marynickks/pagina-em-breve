<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon Page</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- LOGO -->
        <img src="imagens.proj1/logo.png" class="logo" alt="Logo">

        <!-- FOGUETE -->
        <img src="imagens.proj1/foguete.png"class="foguete" alt="Foguete">

        <!-- CONTEÚDO PRINCIPAL -->
        <div class="conteudo">

            <p class="subtitulo">
                Website Is Under Maintenance
            </p>

            <h1>
                We're <span>Launching</span> Soon
            </h1>

            <!-- CONTADOR -->
            <div class="contador">

                <div class="tempo">
                    <span id="dias">00</span>
                    <p>Days</p>
                </div>

                <div class="tempo">
                    <span id="horas">00</span>
                    <p>Hours</p>
                </div>

                <div class="tempo">
                    <span id="minutos">00</span>
                    <p>Minutes</p>
                </div>

                <div class="tempo">
                    <span id="segundos">00</span>
                    <p>Seconds</p>
                </div>

            </div>

            <!-- BOTÃO -->
            <button class="botao">
                Learn More

                <img src="imagens.proj1/triangulo.png" alt="Continuar">
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
